services:
  kuangquan:
    build: .
    image: kuangquan-platform:1.0
    container_name: kuangquan-platform
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      # 生产环境务必替换为随机字符串
      JWT_SECRET: "change-me-to-a-random-string"
    volumes:
      # 数据持久化：SQLite 数据文件 + 上传资产
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
